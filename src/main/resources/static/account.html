<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My account — Sri Devi Modern Rice Mill</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="/css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <div id="nav-root"></div>
    <main class="container py-4 fade-in" style="max-width: 520px">
      <h1 class="h3 mb-4">My account</h1>
      <div id="gate" class="alert alert-warning d-none">Please <a href="/customer-login.html">sign in with your phone</a> to manage your account.</div>
      <div id="panel" class="d-none">
        <div id="msg" class="alert d-none" role="alert"></div>
        <div class="card shadow-sm border-0 mb-4">
          <div class="card-body">
            <h5 class="card-title">Profile</h5>
            <p class="small text-muted mb-3">Signed in as <span id="who" class="text-dark fw-semibold"></span></p>
            <form id="profForm" novalidate>
              <div class="mb-3">
                <label class="form-label" for="name">Display name</label>
                <input type="text" class="form-control" id="name" required maxlength="120" />
                <div class="invalid-feedback">Enter your name.</div>
              </div>
              <hr class="text-muted" />
              <p class="small text-muted mb-2">Change password (optional)</p>
              <div class="mb-2">
                <label class="form-label" for="curPw">Current password</label>
                <input type="password" class="form-control" id="curPw" autocomplete="current-password" />
              </div>
              <div class="mb-2">
                <label class="form-label" for="newPw">New password</label>
                <input type="password" class="form-control" id="newPw" minlength="6" maxlength="100" autocomplete="new-password" />
              </div>
              <div class="mb-3">
                <label class="form-label" for="newPw2">Confirm new password</label>
                <input type="password" class="form-control" id="newPw2" minlength="6" maxlength="100" autocomplete="new-password" />
              </div>
              <button type="submit" class="btn btn-success">Save changes</button>
            </form>
          </div>
        </div>
        <div class="card shadow-sm border-danger border-opacity-25">
          <div class="card-body">
            <h5 class="card-title text-danger">Delete account</h5>
            <p class="small text-muted mb-3">
              Permanently remove your account. You can only delete if you have no orders or feedback on file.
            </p>
            <button type="button" class="btn btn-outline-danger" id="delBtn">Delete my account</button>
          </div>
        </div>
      </div>
    </main>
    <div id="footer-root"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/layout.js"></script>
    <script>
      function showMsg(text, ok) {
        const m = document.getElementById("msg");
        m.textContent = text;
        m.className = "alert " + (ok ? "alert-success" : "alert-danger");
        m.classList.remove("d-none");
      }

      async function init() {
        const me = await fetch("/api/auth/me", { credentials: "same-origin" }).then((r) => r.json());
        if (!me.authenticated || me.role !== "ROLE_USER") {
          document.getElementById("gate").classList.remove("d-none");
          return;
        }
        const r = await fetch("/api/users/me", { credentials: "same-origin" });
        if (!r.ok) {
          document.getElementById("gate").classList.remove("d-none");
          document.getElementById("gate").innerHTML = "Could not load profile. <a href='/customer-login.html'>Sign in</a> again.";
          return;
        }
        const p = await r.json();
        document.getElementById("panel").classList.remove("d-none");
        document.getElementById("who").textContent = p.phone || p.name || p.email;
        document.getElementById("name").value = p.name;

        document.getElementById("profForm").addEventListener("submit", async (e) => {
          e.preventDefault();
          const form = e.target;
          document.getElementById("msg").classList.add("d-none");
          const name = document.getElementById("name").value.trim();
          const cur = document.getElementById("curPw").value;
          const np = document.getElementById("newPw").value;
          const np2 = document.getElementById("newPw2").value;
          if (!name) {
            form.classList.add("was-validated");
            return;
          }
          if (np || np2 || cur) {
            if (np !== np2) {
              showMsg("New passwords do not match.", false);
              return;
            }
            if (np.length < 6) {
              showMsg("New password must be at least 6 characters.", false);
              return;
            }
            if (!cur) {
              showMsg("Enter your current password to set a new one.", false);
              return;
            }
          }
          const body = { name };
          if (np) {
            body.newPassword = np;
            body.currentPassword = cur;
          }
          const pr = await fetch("/api/users/me", {
            method: "PATCH",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          const data = await pr.json().catch(() => ({}));
          if (!pr.ok) {
            showMsg(data.error || "Update failed.", false);
            return;
          }
          showMsg("Profile updated.", true);
          if (window.refreshNavbar) window.refreshNavbar();
          document.getElementById("curPw").value = "";
          document.getElementById("newPw").value = "";
          document.getElementById("newPw2").value = "";
          form.classList.remove("was-validated");
        });

        document.getElementById("delBtn").addEventListener("click", async () => {
          if (!confirm("Delete your account permanently? This cannot be undone.")) return;
          const dr = await fetch("/api/users/me", { method: "DELETE", credentials: "same-origin" });
          if (dr.status === 204) {
            window.location.href = "/index.html";
            return;
          }
          const data = await dr.json().catch(() => ({}));
          alert(data.error || "Could not delete account.");
        });
      }

      document.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
</html>
