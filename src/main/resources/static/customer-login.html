<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Customer sign in — Sri Devi Modern Rice Mill</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="/css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <div id="nav-root"></div>
    <main class="container py-5" style="max-width: 420px">
      <h1 class="h3 mb-4 text-center">Customer sign in</h1>
      <p class="text-muted small text-center mb-3">Enter your 10-digit mobile number. First-time visitors can add your name below.</p>
      <div id="err" class="alert alert-danger d-none" role="alert"></div>
      <form class="card shadow border-0 p-4" id="form">
        <div class="mb-3">
          <label class="form-label" for="phone">Mobile number</label>
          <input type="tel" class="form-control" id="phone" name="phone" required autocomplete="tel" maxlength="15" placeholder="10-digit mobile" />
        </div>
        <div class="mb-3">
          <label class="form-label" for="name">Your name <span class="text-muted">(optional)</span></label>
          <input type="text" class="form-control" id="name" name="name" maxlength="120" autocomplete="name" placeholder="How we should address you" />
        </div>
        <button type="submit" class="btn btn-success w-100">Continue to shop</button>
      </form>
      <p class="small text-center text-muted mt-3 mb-0">
        <a href="/index.html">Back to home</a>
      </p>
    </main>
    <div id="footer-root"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/layout.js"></script>
    <script>
      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const err = document.getElementById("err");
        err.classList.add("d-none");
        const phone = document.getElementById("phone").value.trim();
        const name = document.getElementById("name").value.trim();
        try {
          const r = await fetch("/api/auth/customer/login", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phone, name: name || null }),
          });
          const data = await r.json().catch(() => ({}));
          if (!r.ok) {
            err.textContent = data.error || "Could not sign in. Check your number.";
            err.classList.remove("d-none");
            return;
          }
          location.href = "/products.html";
        } catch {
          err.textContent = "Network error. Try again.";
          err.classList.remove("d-none");
        }
      });
    </script>
  </body>
</html>
