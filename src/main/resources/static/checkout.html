<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout — Sri Devi Modern Rice Mill</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="/css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <div id="nav-root"></div>
    <main class="container py-4 fade-in">
      <h1 class="h3 mb-4">Checkout</h1>
      <div id="gate" class="alert alert-warning d-none">
        Please <a href="/customer-login.html">sign in with your phone</a> to complete your order.
      </div>
      <div id="mainPanel" class="row g-4 d-none">
        <div class="col-lg-7">
          <div class="card shadow-sm border-0">
            <div class="card-body">
              <h5 class="card-title">Order summary</h5>
              <ul class="list-group list-group-flush mb-3" id="lines"></ul>
              <p class="fw-bold mb-0" id="sumTotal"></p>
            </div>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="card shadow-sm border-0">
            <div class="card-body">
              <h5 class="card-title">Delivery details</h5>
              <div class="mb-2">
                <label class="form-label" for="recipientName">Recipient name</label>
                <input type="text" class="form-control" id="recipientName" maxlength="120" required />
              </div>
              <div class="mb-2">
                <label class="form-label" for="deliveryPhone">Phone number</label>
                <input type="tel" class="form-control" id="deliveryPhone" pattern="[0-9]{10}" maxlength="10" required />
              </div>
              <div class="mb-2">
                <label class="form-label" for="deliveryAddress">Full delivery address</label>
                <textarea class="form-control" id="deliveryAddress" rows="3" maxlength="500" required></textarea>
              </div>
              <div class="mb-2">
                <label class="form-label" for="deliveryPincode">Pincode</label>
                <input type="text" class="form-control" id="deliveryPincode" pattern="[0-9]{6}" maxlength="6" required />
              </div>
              <div class="mb-3">
                <label class="form-label" for="deliveryLandmark">Landmark (optional)</label>
                <input type="text" class="form-control" id="deliveryLandmark" maxlength="200" />
              </div>

              <h5 class="card-title mt-2">Payment</h5>
              <div class="form-check mb-2">
                <input class="form-check-input" type="radio" name="pay" id="cod" value="COD" checked />
                <label class="form-check-label" for="cod">Cash on delivery</label>
              </div>
              <div class="form-check mb-3">
                <input class="form-check-input" type="radio" name="pay" id="qr" value="QR" />
                <label class="form-check-label" for="qr">UPI / QR code</label>
              </div>
              <div id="qrBox" class="text-center d-none mb-3 p-3 bg-light rounded">
                <img id="qrImg" src="/images/payment-qr.svg" alt="Payment QR" class="img-fluid border p-1 bg-white shadow-sm mb-2" style="max-width: 220px" />
                <p class="small text-muted mt-1 mb-2">Scan to pay: <strong>₹<span id="qrAmount">0</span></strong></p>
                <div id="qrLinkContainer"></div>
              </div>
              <div id="msg" class="alert d-none"></div>
              <button type="button" class="btn btn-success w-100" id="place">Place order</button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <div id="footer-root"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/layout.js"></script>
    <script>
      let currentTotal = 0;

      function updateUpiDetails() {
        const isQr = document.getElementById("qr").checked;
        const qrBox = document.getElementById("qrBox");
        qrBox.classList.toggle("d-none", !isQr);
        if (isQr && currentTotal > 0) {
          const upiId = "9965749999@okbizaxis"; // Replace with your real merchant UPI ID if needed
          const merchantName = encodeURIComponent("Sri Devi Modern Rice Mill");
          const upiUrl = `upi://pay?pa=${upiId}&pn=${merchantName}&am=${currentTotal}&cu=INR&tn=Order%20Payment`;
          
          document.getElementById("qrAmount").textContent = currentTotal;
          document.getElementById("qrImg").src = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(upiUrl)}`;
          
          const qrLinkContainer = document.getElementById("qrLinkContainer");
          qrLinkContainer.innerHTML = `<a href="${upiUrl}" class="btn btn-sm btn-outline-success w-100"><i class="bi bi-wallet2 me-1"></i>Pay via UPI App (GPay/PhonePe/Paytm)</a>`;
        }
      }

      document.querySelectorAll('input[name="pay"]').forEach((r) => {
        r.addEventListener("change", updateUpiDetails);
      });

      async function init() {
        const me = await fetch("/api/auth/me", { credentials: "same-origin" }).then((r) => r.json());
        if (!me.authenticated || me.role !== "ROLE_USER") {
          document.getElementById("gate").classList.remove("d-none");
          return;
        }
        document.getElementById("mainPanel").classList.remove("d-none");
        if (me.phone) {
          document.getElementById("deliveryPhone").value = me.phone;
        }
        const r = await fetch("/api/cart", { credentials: "same-origin" });
        const cart = await r.json();
        const lines = document.getElementById("lines");
        lines.innerHTML = "";
        if (!cart.items.length) {
          lines.innerHTML = '<li class="list-group-item">Cart empty. <a href="/products.html">Add items</a></li>';
          document.getElementById("place").disabled = true;
        } else {
          cart.items.forEach((i) => {
            const li = document.createElement("li");
            li.className = "list-group-item d-flex justify-content-between";
            li.innerHTML = `<span>${i.name} × ${i.quantity}</span><span>₹${Number(i.lineTotal).toFixed(0)}</span>`;
            lines.appendChild(li);
          });
        }
        currentTotal = Number(cart.total).toFixed(0);
        document.getElementById("sumTotal").textContent = "Total: ₹" + currentTotal;
        updateUpiDetails();
      }

      document.getElementById("place").addEventListener("click", async () => {
        const msg = document.getElementById("msg");
        msg.classList.add("d-none");
        const method = document.getElementById("qr").checked ? "QR" : "COD";
        const recipientName = document.getElementById("recipientName").value.trim();
        const deliveryPhone = document.getElementById("deliveryPhone").value.trim();
        const deliveryAddress = document.getElementById("deliveryAddress").value.trim();
        const deliveryPincode = document.getElementById("deliveryPincode").value.trim();
        const deliveryLandmark = document.getElementById("deliveryLandmark").value.trim();

        if (!recipientName || !/^\d{10}$/.test(deliveryPhone) || !deliveryAddress || !/^\d{6}$/.test(deliveryPincode)) {
          msg.textContent = "Please enter valid delivery details (name, 10-digit phone, address, 6-digit pincode).";
          msg.className = "alert alert-danger";
          msg.classList.remove("d-none");
          return;
        }

        const r = await fetch("/api/checkout", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            paymentMethod: method,
            recipientName,
            deliveryPhone,
            deliveryAddress,
            deliveryPincode,
            deliveryLandmark: deliveryLandmark || null,
          }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) {
          msg.textContent = data.error || "Checkout failed.";
          msg.className = "alert alert-danger";
          msg.classList.remove("d-none");
          return;
        }
        let extra = "";
        if (data.estimatedDeliveryAt) {
          extra = " Expected delivery by " + new Date(data.estimatedDeliveryAt).toLocaleString() + ".";
        }
        msg.textContent = "Order #" + data.orderId + " placed." + extra + " Redirecting to tracking…";
        msg.className = "alert alert-success";
        msg.classList.remove("d-none");
        setTimeout(() => (location.href = "/tracking.html?order=" + data.orderId), 1800);
      });

      document.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
</html>
