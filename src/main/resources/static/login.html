<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin sign in — Sri Devi Modern Rice Mill</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="/css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <div id="nav-root"></div>
    <main class="container py-5" style="max-width: 420px">
      <h1 class="h3 mb-4 text-center">Admin sign in</h1>
      <p class="text-muted small text-center mb-3">Use your admin email and password. After login you can open the dashboard.</p>
      <div id="err" class="alert alert-danger d-none" role="alert">Invalid email or password.</div>
      <form action="/login" method="post" class="card shadow border-0 p-4" id="loginForm">
        <div class="mb-3">
          <label class="form-label" for="username">Email</label>
          <input type="email" class="form-control" id="username" name="username" required autocomplete="username" />
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            required
            minlength="6"
            autocomplete="current-password"
          />
        </div>
        <button type="submit" class="btn btn-success w-100">Sign in</button>
      </form>
      <p class="small text-center text-muted mt-3 mb-0">
        <a href="/index.html">Back to home</a> · <a href="/customer-login.html">Customer sign in</a>
      </p>
      <p class="small text-center text-muted mt-3">
        Demo admin: <code>admin@ricemill.local</code> / <code>admin123</code>
      </p>
    </main>
    <div id="footer-root"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/layout.js"></script>
    <script>
      const params = new URLSearchParams(location.search);
      const next = params.get("next");
      if (next && next.startsWith("/") && !next.startsWith("//")) {
        document.getElementById("loginForm").action = "/login?next=" + encodeURIComponent(next);
      }

      if (new URLSearchParams(location.search).get("error")) {
        document.getElementById("err").classList.remove("d-none");
      }
    </script>
  </body>
</html>
