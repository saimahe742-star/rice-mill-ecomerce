<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cart — Sri Devi Modern Rice Mill</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="/css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <div id="nav-root"></div>
    <main class="container py-4 fade-in">
      <h1 class="h3 mb-4">Shopping cart</h1>
      <div id="empty" class="alert alert-secondary d-none">Your cart is empty. <a href="/products.html">Browse products</a>.</div>
      <div class="table-responsive shadow-sm rounded bg-white d-none" id="wrap">
        <table class="table table-admin align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Product</th>
              <th>Price</th>
              <th style="width: 140px">Qty</th>
              <th>Line</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2" id="footerBar">
        <a href="/products.html" class="btn btn-outline-secondary">Continue shopping</a>
        <div>
          <span class="fw-bold me-3" id="total"></span>
          <a href="/checkout.html" class="btn btn-success" id="co">Checkout</a>
        </div>
      </div>
    </main>
    <div id="footer-root"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/layout.js"></script>
    <script>
      async function loadCart() {
        const r = await fetch("/api/cart", { credentials: "same-origin" });
        const data = await r.json();
        const tbody = document.getElementById("tbody");
        const empty = document.getElementById("empty");
        const wrap = document.getElementById("wrap");
        tbody.innerHTML = "";
        if (!data.items.length) {
          empty.classList.remove("d-none");
          wrap.classList.add("d-none");
          document.getElementById("footerBar").classList.add("d-none");
          return;
        }
        empty.classList.add("d-none");
        wrap.classList.remove("d-none");
        document.getElementById("footerBar").classList.remove("d-none");
        data.items.forEach((i) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>
              <div class="d-flex align-items-center gap-2">
                <img src="${i.imageUrl || "/images/sample-rice.svg"}" alt="" width="48" height="48" class="rounded" style="object-fit:contain;background:#f0f4f0" />
                <span>${i.name}</span>
              </div>
            </td>
            <td>₹${Number(i.price).toFixed(0)}</td>
            <td>
              <input type="number" min="1" class="form-control form-control-sm qty" data-id="${i.productId}" value="${i.quantity}" />
            </td>
            <td>₹${Number(i.lineTotal).toFixed(0)}</td>
            <td><button type="button" class="btn btn-sm btn-outline-danger rm" data-id="${i.productId}">Remove</button></td>`;
          tbody.appendChild(tr);
        });
        document.getElementById("total").textContent = "Total: ₹" + Number(data.total).toFixed(0);

        tbody.querySelectorAll(".qty").forEach((inp) => {
          inp.addEventListener("change", async () => {
            const id = +inp.dataset.id;
            const q = Math.max(1, parseInt(inp.value, 10) || 1);
            const res = await fetch("/api/cart/item/" + id, {
              method: "PUT",
              credentials: "same-origin",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ quantity: q }),
            });
            const d = await res.json().catch(() => ({}));
            if (!res.ok) {
              alert(d.error || "Could not update quantity.");
            }
            loadCart();
          });
        });
        tbody.querySelectorAll(".rm").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const id = +btn.dataset.id;
            await fetch("/api/cart/item/" + id, { method: "DELETE", credentials: "same-origin" });
            loadCart();
          });
        });
      }

      document.getElementById("co").addEventListener("click", async (e) => {
        e.preventDefault();
        location.href = "/checkout.html";
      });

      document.addEventListener("DOMContentLoaded", loadCart);
    </script>
  </body>
</html>
