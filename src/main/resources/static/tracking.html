<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Track order — Sri Devi Modern Rice Mill</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="/css/styles.css" rel="stylesheet" />
  </head>
  <body>
    <div id="nav-root"></div>
    <main class="container py-4 fade-in">
      <h1 class="h3 mb-4">Order tracking</h1>
      <div id="gate" class="alert alert-warning d-none">
        Please <a href="/customer-login.html">sign in with your phone</a> to see your orders.
      </div>
      <div id="panel" class="d-none">
        <div class="mb-3">
          <label class="form-label">Select order</label>
          <select class="form-select" id="orderSel"></select>
        </div>
        <div class="card shadow-sm border-0">
          <div class="card-body">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
              <h5 class="mb-0">Order #<span id="oid"></span></h5>
              <span class="status-pill status-PENDING" id="st">Placed</span>
            </div>
            <p class="small text-muted mb-1">Placed: <span id="when"></span></p>
            <p class="small text-muted mb-1 d-none" id="etaRow">Expected delivery: <span id="eta"></span></p>
            <p class="small text-muted mb-1">Payment: <span id="pay"></span></p>
            <p class="small text-muted mb-3">Received by customer: <span id="recv"></span></p>
            <div class="d-flex flex-wrap gap-2 mb-3">
              <button type="button" class="btn btn-sm btn-outline-danger d-none" id="cancelBtn">Cancel this order</button>
              <button type="button" class="btn btn-sm btn-success d-none" id="waShareBtn">
                <i class="bi bi-whatsapp me-1"></i>Send Details to WhatsApp
              </button>
            </div>
            <h6 class="text-secondary text-uppercase small">Items</h6>
            <ul class="list-group list-group-flush mb-0" id="items"></ul>
            <p class="fw-bold mt-3 mb-0">Total: ₹<span id="tot"></span></p>
            <p class="small text-muted mt-3 mb-0">
              <i class="bi bi-arrow-repeat"></i> Status refreshes every 5 seconds for near real-time tracking.
            </p>
          </div>
        </div>
      </div>
    </main>
    <div id="footer-root"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/layout.js"></script>
    <script>
      let pollTimer;
      let currentId;
      let loadedOrder;

      function displayStatus(raw) {
        if (raw === "PENDING") return "Placed";
        if (raw === "CANCELLED") return "Cancelled";
        return raw;
      }

      async function loadList() {
        const r = await fetch("/api/orders/mine", { credentials: "same-origin" });
        if (r.status === 401) return null;
        return r.json();
      }

      function renderDetail(o) {
        loadedOrder = o;
        document.getElementById("oid").textContent = o.id;
        const st = document.getElementById("st");
        const raw = o.status;
        st.textContent = displayStatus(raw);
        st.className = "status-pill status-" + raw;
        document.getElementById("when").textContent = new Date(o.createdAt).toLocaleString();
        document.getElementById("pay").textContent = o.paymentMethod;
        document.getElementById("recv").textContent = o.itemReceived ? "Yes" : "No";
        document.getElementById("tot").textContent = Number(o.totalPrice).toFixed(0);
        
        const cancelBtn = document.getElementById("cancelBtn");
        const canCancel = raw === "PENDING";
        cancelBtn.classList.toggle("d-none", !canCancel);
        cancelBtn.disabled = !canCancel;

        const waShareBtn = document.getElementById("waShareBtn");
        waShareBtn.classList.remove("d-none");

        const etaRow = document.getElementById("etaRow");
        if (o.estimatedDeliveryAt) {
          etaRow.classList.remove("d-none");
          document.getElementById("eta").textContent = new Date(o.estimatedDeliveryAt).toLocaleString();
        } else {
          etaRow.classList.add("d-none");
        }
        const ul = document.getElementById("items");
        ul.innerHTML = "";
        (o.items || []).forEach((i) => {
          const li = document.createElement("li");
          li.className = "list-group-item d-flex justify-content-between";
          li.innerHTML = `<span>${i.productName} × ${i.quantity}</span><span>₹${Number(i.unitPrice).toFixed(0)}</span>`;
          ul.appendChild(li);
        });
      }

      async function refreshDetail() {
        if (!currentId) return;
        const r = await fetch("/api/orders/" + currentId, { credentials: "same-origin" });
        if (!r.ok) return;
        const o = await r.json();
        renderDetail(o);
      }

      async function cancelCurrentOrder() {
        if (!currentId) return;
        if (!confirm("Cancel this order? Stock will be restored automatically.")) return;
        const r = await fetch("/api/orders/" + currentId + "/cancel", {
          method: "POST",
          credentials: "same-origin",
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) {
          alert(data.error || "Could not cancel order.");
          return;
        }
        renderDetail(data);
      }

      async function init() {
        const me = await fetch("/api/auth/me", { credentials: "same-origin" }).then((r) => r.json());
        if (!me.authenticated || me.role !== "ROLE_USER") {
          document.getElementById("gate").classList.remove("d-none");
          return;
        }
        const orders = await loadList();
        if (!orders || !orders.length) {
          document.getElementById("panel").classList.remove("d-none");
          document.getElementById("orderSel").innerHTML = '<option value="">No orders yet</option>';
          document.getElementById("oid").textContent = "—";
          document.getElementById("st").textContent = "—";
          document.getElementById("when").textContent = "—";
          document.getElementById("pay").textContent = "—";
          document.getElementById("recv").textContent = "—";
          document.getElementById("tot").textContent = "0";
          document.getElementById("etaRow").classList.add("d-none");
          document.getElementById("items").innerHTML =
            '<li class="list-group-item text-muted">Place an order from the shop to see it here.</li>';
          return;
        }
        document.getElementById("panel").classList.remove("d-none");
        const sel = document.getElementById("orderSel");
        sel.innerHTML = "";
        const q = new URLSearchParams(location.search).get("order");
        orders.forEach((o) => {
          const opt = document.createElement("option");
          opt.value = o.id;
          opt.textContent = "#" + o.id + " — " + displayStatus(o.status) + " — ₹" + Number(o.totalPrice).toFixed(0);
          sel.appendChild(opt);
        });
        if (q && orders.some((o) => String(o.id) === q)) sel.value = q;
        currentId = sel.value || orders[0].id;
        sel.value = String(currentId);
        await refreshDetail();
        if (pollTimer) clearInterval(pollTimer);
        pollTimer = setInterval(refreshDetail, 5000);
        sel.addEventListener("change", async () => {
          currentId = sel.value;
          await refreshDetail();
        });
      }

      document.addEventListener("DOMContentLoaded", init);
      document.getElementById("cancelBtn").addEventListener("click", cancelCurrentOrder);
      
      document.getElementById("waShareBtn").addEventListener("click", () => {
        if (!loadedOrder) return;
        const o = loadedOrder;
        
        let itemsText = (o.items || []).map(i => `• ${i.productName} x ${i.quantity} (₹${Number(i.unitPrice).toFixed(0)})`).join("\n");
        
        const messageText = `*Sri Devi Modern Rice Mill — Order Confirmation*\n\n` +
          `*Order ID:* #${o.id}\n` +
          `*Status:* ${displayStatus(o.status)}\n` +
          `*Customer:* ${o.recipientName || "—"} (${o.deliveryPhone || "—"})\n` +
          `*Delivery Address:* ${o.deliveryAddress || "—"}, ${o.deliveryPincode || ""}\n` +
          `*Landmark:* ${o.deliveryLandmark || "—"}\n\n` +
          `*Items:* \n${itemsText}\n\n` +
          `*Total Amount:* ₹${Number(o.totalPrice).toFixed(0)}\n` +
          `*Payment Method:* ${o.paymentMethod === "QR" ? "UPI / QR Code" : "Cash on Delivery (COD)"}\n\n` +
          `Please confirm my order. Thank you!`;
          
        const waUrl = `https://wa.me/919965749999?text=${encodeURIComponent(messageText)}`;
        window.open(waUrl, "_blank");
      });
    </script>
  </body>
</html>
