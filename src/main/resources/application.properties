# Server
server.port=8082
spring.application.name=modern-rice-mill-delivery

# MySQL (create database: CREATE DATABASE rice_mill_db;)
spring.datasource.url=jdbc:mysql://localhost:3306/rice_mill_db
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Admin notification email (order alerts)
app.admin.email=deviricemill@gmail.com
app.admin.sms-console=true

# Mail (Gmail SMTP — use an App Password: https://support.google.com/accounts/answer/185833)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
# If mail is not configured, app still runs; email failures are logged
app.mail.enabled=${MAIL_ENABLED:false}

# Estimated delivery window shown to customers (days from order time)
app.delivery.eta-days=2

# Static resources
spring.web.resources.cache.period=3600
